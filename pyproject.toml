[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enfold"
version = "0.1.0"
description = "Enfold: DINOv3 and Cosmos world-action modeling for LIBERO and RoboTwin"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.11.0",
  "av==16.0.1",
  "boto3==1.35.99",
  "datasets==3.6.0",
  "deepspeed==0.18.5",
  "einops==0.8.1",
  "gitpython==3.1.45",
  "huggingface-hub==0.36.0",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "modelscope==1.34.0",
  "numpy==2.2.6",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pandas==2.3.3",
  "pillow==11.3.0",
  "pyarrow==22.0.0",
  "regex==2025.10.23",
  "rich==14.2.0",
  "safetensors==0.6.2",
  "termcolor==2.5.0",
  "torch==2.7.0+cu128",
  "torchcodec==0.5",
  "torchvision==0.22.0+cu128",
  "tqdm==4.67.1",
  "transformers==4.51.3",
  "typing-extensions==4.15.0",
  "wandb==0.22.3",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["enfold*"]
